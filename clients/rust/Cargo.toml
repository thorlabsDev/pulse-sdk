[package]
name = "thornode-pulse"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Rust client SDK for the pulse QUIC decoded-shred transaction stream"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thorlabsDev/pulse-sdk"
homepage = "https://github.com/thorlabsDev/pulse-sdk"
documentation = "https://docs.rs/thornode-pulse"
readme = "README.md"
keywords = ["quic", "solana", "streaming", "sdk"]
categories = ["api-bindings", "network-programming"]

[dependencies]
thornode-pulse-wire = { version = "0.1.0", path = "../../pulse-wire" }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
socket2 = "0.5"

[dev-dependencies]
rcgen = "0.13"
