[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thornode-pulse"
version = "0.1.0"
description = "Async Python SDK for the ThorNode Pulse QUIC transaction stream"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Thor Labs" }]
requires-python = ">=3.9"
keywords = ["solana", "quic", "transactions", "streaming", "thornode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["aioquic>=1.2,<2", "certifi>=2024.7.4"]

[project.urls]
Homepage = "https://github.com/thorlabsDev/pulse-sdk"
Repository = "https://github.com/thorlabsDev/pulse-sdk"
Changelog = "https://github.com/thorlabsDev/pulse-sdk/blob/main/clients/python/CHANGELOG.md"

[project.optional-dependencies]
examples = ["base58>=2.1,<3"]
test = ["pytest>=7"]
release = ["build>=1", "twine>=5"]

[tool.setuptools.packages.find]
include = ["thornode_pulse*"]

[tool.setuptools.package-data]
thornode_pulse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
